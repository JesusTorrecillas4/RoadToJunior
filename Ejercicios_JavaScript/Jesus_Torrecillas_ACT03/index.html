
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestió de tasques</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login">
        <h1>Iniciar sessió</h1>

        <p>Usuari</p>
        <input type="text" id="usuari">

        <p>Contrasenya</p>
        <input type="password" id="contrasenya">

        <button onclick="iniciarSessio()">Entrar</button>
        <p id="errorLogin"></p>
    </div>

    <div id="aplicacio" style="display: none;">
        <h1>Gestió de tasques</h1>

        <h2>Afegir tasca</h2>

        <p>Títol</p>
        <input type="text" id="titol">

        <p>Descripció</p>
        <textarea id="descripcio"></textarea>

        <p>Persona assignada</p>
        <select id="assignada">
            <option value="admin">admin</option>
            <option value="joan">joan</option>
            <option value="maria">maria</option>
        </select>

        <p>Data i hora límit</p>
        <input type="datetime-local" id="dataHora">

        <button onclick="afegirTasca()">Afegir tasca</button>

        <h2>Llista de tasques</h2>

        <select id="filtre" onchange="mostrarTasques()">
            <option value="totes">Totes</option>
            <option value="pendents">Pendents</option>
            <option value="finalitzades">Finalitzades</option>
        </select>

        <div id="llistaTasques"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
