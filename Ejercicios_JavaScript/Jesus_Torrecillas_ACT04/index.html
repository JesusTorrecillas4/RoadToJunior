
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Mascotas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Gestión de Mascotas</h1>
        <p>Registra y administra tus mascotas</p>
    </header>

    <main>
        <section>
            <h2>Añadir mascota</h2>

            <div class="formulario">
                <label>Nombre</label>
                <input type="text" id="nombre" placeholder="Nombre de la mascota">

                <label>Edad</label>
                <input type="number" id="edad" placeholder="Edad" min="0">

                <label>Foto (URL)</label>
                <input type="text" id="foto" placeholder="https://...">

                <label>Tipo de mascota</label>
                <select id="tipo" onchange="cambiarTipo()">
                    <option value="perro">Perro</option>
                    <option value="gato">Gato</option>
                    <option value="pajaro">Pájaro</option>
                </select>

                <div id="campoRaza">
                    <label>Raza</label>
                    <input type="text" id="raza" placeholder="Raza del perro">
                </div>

                <button onclick="guardar()" class="btn-guardar">
                    Guardar mascota
                </button>
            </div>
        </section>

        <section>
            <h2>Mascotas registradas</h2>

            <div class="herramientas">
                <input type="text" id="buscar"
                       placeholder="Buscar por nombre"
                       oninput="buscar()">

                <button onclick="ordenar()">Ordenar A-Z</button>
            </div>

            <div id="lista" class="lista-mascotas"></div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
